<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Terminal: whoami prints Mradul Garg, full-stack developer, Ghaziabad, India. focus.txt lists MERN apps in production on Docker, Nginx and AWS EC2; AI products on a multi-provider LLM layer; Chrome extensions with safety rails; DSA in C++. deploy.sh deploys CodeVerse live at interviewlattice.duckdns.org.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; }
    .p { fill: #A3E635; }
    .c { fill: #F1F5F9; }
    .o { fill: #CBD5E1; }
    .d { fill: #64748B; }
    .a { fill: #FB923C; }
    .ok { fill: #22C55E; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="t1"><rect x="24" y="56" height="26" width="0"><animate attributeName="width" to="110" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="24" y="120" height="26" width="0"><animate attributeName="width" to="170" begin="1.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="24" y="262" height="26" width="0"><animate attributeName="width" to="310" begin="4.2s" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="418" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h790a14 14 0 0 1 14 14v23H1z" fill="#111827"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="20" r="6" fill="#28C840"/>
  <text x="410" y="25" text-anchor="middle" class="d" style="font-size:13px">mradul@dev: ~</text>

  <!-- $ whoami -->
  <g clip-path="url(#t1)"><text x="24" y="74"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/>
    <text x="24" y="100" class="o">Mradul Garg · full-stack developer · Ghaziabad, India</text>
  </g>

  <!-- $ cat focus.txt -->
  <g clip-path="url(#t2)"><text x="24" y="138"><tspan class="p">$</tspan> <tspan class="c">cat focus.txt</tspan></text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/>
    <text x="24" y="164" class="o"><tspan class="a">→</tspan> MERN apps that run in production: Docker, Nginx, AWS EC2</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/>
    <text x="24" y="190" class="o"><tspan class="a">→</tspan> AI products on a multi-provider LLM layer</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/>
    <text x="24" y="216" class="o"><tspan class="a">→</tspan> Chrome extensions with real safety rails</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/>
    <text x="24" y="242" class="o"><tspan class="a">→</tspan> DSA in C++, one problem at a time</text>
  </g>

  <!-- $ ./deploy.sh -->
  <g clip-path="url(#t3)"><text x="24" y="280"><tspan class="p">$</tspan> <tspan class="c">./deploy.sh codeverse --prod</tspan></text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/>
    <text x="24" y="306" class="d">building</text>
    <rect x="112" y="294" width="260" height="14" rx="7" fill="#1E293B"/>
    <rect x="112" y="294" width="0" height="14" rx="7" fill="#A3E635">
      <animate attributeName="width" to="260" begin="5.7s" dur="1.8s" fill="freeze"/>
    </rect>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="7.5s" fill="freeze"/>
    <text x="384" y="306" class="o">100%</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/>
    <text x="24" y="332"><tspan class="ok">✓ live</tspan> <tspan class="o">at</tspan> <tspan class="p">interviewlattice.duckdns.org</tspan></text>
  </g>

  <!-- idle prompt -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="8.3s" fill="freeze"/>
    <text x="24" y="376"><tspan class="p">$</tspan> <tspan class="blink c">█</tspan></text>
  </g>
</svg>
