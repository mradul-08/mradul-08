<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mradul Garg: full-stack developer who builds AI products and ships them to production">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .blink { animation: blink 1s steps(1) infinite; }
    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    .float3 { animation: float 5s ease-in-out -4s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#141B2D"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.42" stop-color="#F1F5F9"/>
      <stop offset="0.5" stop-color="#A3E635"/>
      <stop offset="0.58" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#F1F5F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0;900 0;900 0" keyTimes="0;0.6;1" dur="5s" begin="1.4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.82" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0B0F17" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0F17" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="nameReveal">
      <rect x="60" y="90" height="100" width="0">
        <animate attributeName="width" from="0" to="620" begin="0.3s" dur="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="320" fill="url(#fade)"/>

    <!-- prompt -->
    <text x="64" y="74" class="mono" font-size="16" fill="#A3E635">~/mradul-08 <tspan fill="#64748B">$</tspan> <tspan fill="#CBD5E1">whoami</tspan></text>

    <!-- name -->
    <g clip-path="url(#nameReveal)">
      <text x="60" y="160" class="sans" font-size="72" font-weight="800" letter-spacing="-1" fill="url(#shine)">Mradul Garg</text>
    </g>

    <!-- rotating role line -->
    <g class="mono" font-size="24">
      <text x="64" y="212" fill="#FB923C">&gt;</text>
      <text x="92" y="212" fill="#CBD5E1" opacity="0">full-stack developer<tspan class="blink" fill="#A3E635">▍</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.333;1" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="212" fill="#CBD5E1" opacity="0">builds AI products<tspan class="blink" fill="#A3E635">▍</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.333;1" dur="9s" begin="4.4s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="212" fill="#CBD5E1" opacity="0">ships to production<tspan class="blink" fill="#A3E635">▍</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.333;1" dur="9s" begin="7.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- status -->
    <circle cx="70" cy="263" r="5" fill="#22C55E"/>
    <circle cx="70" cy="263" r="5" fill="none" stroke="#22C55E" stroke-width="2">
      <animate attributeName="r" values="5;14" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="268" class="mono" font-size="15" fill="#94A3B8">open to SDE roles · Ghaziabad, India</text>

    <!-- orbit system -->
    <g transform="translate(960 160)">
      <circle r="62" fill="none" stroke="#1F2A3D" stroke-width="1.5"/>
      <circle r="104" fill="none" stroke="#1F2A3D" stroke-width="1.5" stroke-dasharray="4 7"/>
      <circle r="140" fill="none" stroke="#1F2A3D" stroke-width="1.5"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="6" fill="#A3E635"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="140" to="-220" dur="16s" repeatCount="indefinite"/>
        <circle cx="104" cy="0" r="7" fill="#FB923C"/>
        <circle cx="-104" cy="0" r="4" fill="#38BDF8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="24s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="5" fill="#F1F5F9"/>
        <circle cx="0" cy="140" r="6" fill="#A78BFA"/>
      </g>

      <circle r="34" fill="#A3E635" opacity="0.12">
        <animate attributeName="r" values="30;40;30" dur="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-30" y="-24" width="60" height="48" rx="12" fill="#111827" stroke="#A3E635" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#A3E635">&lt;/&gt;</text>
    </g>

    <!-- floating stack labels -->
    <g class="mono" font-size="13" fill="#64748B">
      <text x="780" y="58" class="float1">react</text>
      <text x="1110" y="86" class="float2">node</text>
      <text x="1120" y="262" class="float3">docker</text>
      <text x="790" y="282" class="float2">aws</text>
      <text x="1128" y="176" class="float1">llm</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1E293B"/>
</svg>
