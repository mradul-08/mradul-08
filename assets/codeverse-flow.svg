<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="CodeVerse architecture: React browser to Nginx over HTTPS to the Express API, which runs code in Docker sandboxes, stores data in MongoDB and hosts mock interviews on LiveKit. Runs on Ubuntu EC2 with systemd and daily backups.">
  <style>
    text { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .t { fill: #F1F5F9; font-size: 15px; font-weight: 700; }
    .s { fill: #94A3B8; font-size: 12px; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #64748B; font-size: 11px; }
    .box { fill: #111827; stroke: #334155; stroke-width: 1.5; }
    .hot { fill: #111827; stroke: #A3E635; stroke-width: 2; }
    .wire { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>
  <rect x="1" y="1" width="898" height="288" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>

  <!-- wires -->
  <path id="w1" class="wire" d="M170 130H205"/>
  <path id="w2" class="wire" d="M355 130H390"/>
  <path id="w3" class="wire" d="M540 130C590 130 590 52 640 52"/>
  <path id="w4" class="wire" d="M540 130H640"/>
  <path id="w5" class="wire" d="M540 130C590 130 590 210 640 210"/>

  <!-- packets -->
  <circle r="4" fill="#A3E635"><animateMotion dur="2.4s" repeatCount="indefinite" path="M20 130H640" keyPoints="0;1" keyTimes="0;1"/></circle>
  <circle r="4" fill="#FB923C"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
  <circle r="4" fill="#38BDF8"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>

  <!-- nodes -->
  <rect class="box" x="20" y="98" width="150" height="64" rx="10"/>
  <text class="t" x="95" y="126" text-anchor="middle">Browser</text>
  <text class="s" x="95" y="146" text-anchor="middle">React · Monaco · Socket.IO</text>

  <rect class="box" x="205" y="98" width="150" height="64" rx="10"/>
  <text class="t" x="280" y="126" text-anchor="middle">Nginx</text>
  <text class="s" x="280" y="146" text-anchor="middle">HTTPS · reverse proxy</text>

  <rect class="hot" x="390" y="98" width="150" height="64" rx="10"/>
  <text class="t" x="465" y="126" text-anchor="middle">Express API</text>
  <text class="s" x="465" y="146" text-anchor="middle">auth · jobs · realtime</text>

  <rect class="box" x="640" y="20" width="236" height="64" rx="10"/>
  <text class="t" x="758" y="48" text-anchor="middle">Docker sandbox</text>
  <text class="s" x="758" y="68" text-anchor="middle">C++ · Java · Python · JS, no network</text>

  <rect class="box" x="640" y="98" width="236" height="64" rx="10"/>
  <text class="t" x="758" y="126" text-anchor="middle">MongoDB</text>
  <text class="s" x="758" y="146" text-anchor="middle">data · sessions · daily backups</text>

  <rect class="box" x="640" y="178" width="236" height="64" rx="10"/>
  <text class="t" x="758" y="206" text-anchor="middle">LiveKit</text>
  <text class="s" x="758" y="226" text-anchor="middle">mock interview rooms</text>

  <text class="m" x="450" y="272" text-anchor="middle">ubuntu ec2 · systemd auto-restart · health check every 5 min</text>
</svg>
