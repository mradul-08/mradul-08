<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="GenWeb.ai flow: your idea goes through a prompt enhancer, then an AI provider with fallback across Groq, Mistral, Cerebras and OpenRouter, becomes responsive HTML and is deployed to a live URL. You can refine the site by chatting.">
  <style>
    text { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .t { fill: #F1F5F9; font-size: 15px; font-weight: 700; }
    .s { fill: #94A3B8; font-size: 12px; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #64748B; font-size: 11px; }
    .pill { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #CBD5E1; font-size: 13px; }
    .box { fill: #111827; stroke: #334155; stroke-width: 1.5; }
    .wire { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    .loop { fill: none; stroke: #FB923C; stroke-width: 1.5; stroke-dasharray: 4 6; animation: flow 1s linear infinite reverse; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>
  <rect x="1" y="1" width="898" height="288" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>

  <!-- wires -->
  <path class="wire" d="M170 150H205"/>
  <path class="wire" d="M355 150H390"/>
  <path class="wire" d="M540 150H585"/>
  <path class="wire" d="M735 150H760"/>
  <path class="loop" d="M660 118C660 40 465 40 465 70"/>
  <text class="m" x="562" y="50" text-anchor="middle" style="fill:#FB923C">refine by chat</text>

  <!-- packet -->
  <circle r="4" fill="#A3E635"><animateMotion dur="3s" repeatCount="indefinite" path="M20 150H880"/></circle>

  <!-- idea -->
  <rect class="box" x="20" y="118" width="150" height="64" rx="10"/>
  <text class="t" x="95" y="146" text-anchor="middle">Your idea</text>
  <text class="s" x="95" y="166" text-anchor="middle">"a café landing page"</text>

  <!-- enhancer -->
  <rect class="box" x="205" y="118" width="150" height="64" rx="10"/>
  <text class="t" x="280" y="146" text-anchor="middle">Prompt enhancer</text>
  <text class="s" x="280" y="166" text-anchor="middle">idea → detailed brief</text>

  <!-- provider fallback -->
  <rect x="390" y="70" width="150" height="176" rx="10" fill="#0F1522" stroke="#334155" stroke-dasharray="3 4"/>
  <rect x="400" y="80" width="130" height="32" rx="8" fill="#111827"/>
  <rect x="400" y="120" width="130" height="32" rx="8" fill="#111827"/>
  <rect x="400" y="160" width="130" height="32" rx="8" fill="#111827"/>
  <rect x="400" y="200" width="130" height="32" rx="8" fill="#111827"/>
  <rect x="400" y="80" width="130" height="32" rx="8" fill="none" stroke="#A3E635" stroke-width="2">
    <animate attributeName="y" values="80;120;160;200;80" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text class="pill" x="465" y="101" text-anchor="middle">groq</text>
  <text class="pill" x="465" y="141" text-anchor="middle">mistral</text>
  <text class="pill" x="465" y="181" text-anchor="middle">cerebras</text>
  <text class="pill" x="465" y="221" text-anchor="middle">openrouter</text>
  <text class="m" x="465" y="266" text-anchor="middle">fallback + key rotation</text>

  <!-- html -->
  <rect class="box" x="585" y="118" width="150" height="64" rx="10"/>
  <text class="t" x="660" y="146" text-anchor="middle">Responsive HTML</text>
  <text class="s" x="660" y="166" text-anchor="middle">desktop · tablet · mobile</text>

  <!-- live -->
  <rect x="760" y="118" width="120" height="64" rx="10" fill="#111827" stroke="#A3E635" stroke-width="2"/>
  <text class="t" x="820" y="146" text-anchor="middle">Live URL</text>
  <text class="s" x="820" y="166" text-anchor="middle">one-click deploy</text>
</svg>
